name: CI

on:
  push:
  pull_request:

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sintaxe e teste headless (tools/testar.mjs)
        env:
          CHROME: /usr/bin/google-chrome
        run: node tools/testar.mjs
